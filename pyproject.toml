[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbgsom"
version = "1.2.4"
authors = [
  { name="Sandro Martens", email="sandro.martens@web.de" },
]
description = "A Python implementation of the Directed Batch Growing Self-Organizing Map"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "networkx>=3.0.0",
    "numba>=0.61.0",
    "numpy>=2.1.0",
    "pandas>=3.0.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.10.0",
    "tqdm>=4.0.0",
]

[project.urls]
"Homepage" = "https://github.com/SandroMartens/DBGSOM"
"Docmentation" = "https://dbgsom.readthedocs.io/"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
]

[tool.ruff.lint]
select = [
    "E", "W",    # PEP 8 Fehler und Warnungen
    "F",         # Pyflakes (Logikfehler)
    "C90",       # McCabe Cyclomatic Complexity (z. B. Limit hart auf 10 setzen!)
    "S",         # Bandit (Security-Checks / Verhinderung von eval, unsicheren Libs)
    "D",         # Pydocstyle (Zwingende Dokumentation aller Funktionen/Klassen)
    "ANN",       # Flake8-Annotations (Zwingende Type Hints für jede Funktion)
    "I",         # Isort (Strikte Ordnung bei Imports)
]
ignore = ["D400", "D415", "D205"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D"]
"benchmarks/**" = ["ANN", "D"]

[tool.ruff.lint.mccabe]
max-complexity = 10  # Alles über Komplexität 10 blockiert den Build

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "ipykernel>=7.2.0",
    "line-profiler>=4.0.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "sympy>=1.14.0",
    "ty>=0.0.39",
    "uv>=0.11.16",
]
examples = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.0.0",
    "minisom>=2.3.6",
    "scikit-image>=0.23.0",
    "susi>=1.4.3",
    "umap-learn>=0.5.12",
]
docs = [
    "babel>=2.18.0",
    "furo>=2025.12.19",
    "matplotlib>=3.9.0",
    "numpydoc>=1.10.0",
    "pillow>=11.0.0",
    "sphinx>=9.0.4",
    "sphinx-autodoc-typehints>=3.6.1",
    "sphinx-gallery>=0.18.0",
]
