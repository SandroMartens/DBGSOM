[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbgsom"
authors = [
  { name="Sandro Martens", email="sandro.martens@web.de" },
]
description = "A Python implementation of the Directed Batch Growing Self-Organizing Map"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dynamic = ["dependencies", "license", "version"]

[project.urls]
"Homepage" = "https://github.com/SandroMartens/DBGSOM"
"Docmentation" = "https://dbgsom.readthedocs.io/en/latest/"

[tool.ruff.lint]
select = [
    "E", "W",    # PEP 8 Fehler und Warnungen
    "F",         # Pyflakes (Logikfehler)
    "C90",       # McCabe Cyclomatic Complexity (z. B. Limit hart auf 10 setzen!)
    "S",         # Bandit (Security-Checks / Verhinderung von eval, unsicheren Libs)
    "D",         # Pydocstyle (Zwingende Dokumentation aller Funktionen/Klassen)
    "ANN",       # Flake8-Annotations (Zwingende Type Hints für jede Funktion)
    "I",         # Isort (Strikte Ordnung bei Imports)
]

[tool.ruff.lint.mccabe]
max-complexity = 10  # Alles über Komplexität 10 blockiert den Build