# This workflow integrates Python Static Analyzer (Pysa) with
# GitHub's Code Scanning feature.
name: Pysa

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '24 10 * * 3'

permissions:
  contents: read

jobs:
  pysa:
    permissions:
      actions: read
      contents: read
      security-events: write

    runs-on: ubuntu-latest
    steps:
      # 1. Repository auschecken (aktualisiert auf v4)
      - uses: actions/checkout@v4
        with:
          submodules: true

      # 2. uv installieren, um Abhängigkeiten sauber zu verarbeiten
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # 3. Temporäre requirements.txt direkt aus deiner pyproject.toml generieren
      - name: Generate requirements.txt for Pysa
        run: uv pip compile pyproject.toml -o requirements.txt

      # 4. Pysa Sicherheits-Scan ausführen
      - name: Run Pysa
        uses: facebook/pysa-action@f46a63777e59268613bd6e2ff4e29f144ca9e88b
        with:
          repo-directory: './'
          # Pysa nutzt jetzt die frisch generierte Datei:
          requirements-path: 'requirements.txt'
          infer-types: true
          include-default-sapp-filters: true