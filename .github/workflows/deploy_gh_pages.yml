name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# WICHTIG: Erlaubt dem GitHub-Bot, die fertige Doku in den gh-pages Branch zu pushen
permissions:
  contents: write

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. uv installieren (blitzschneller Ersatz für Pixi)
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 2. Python-Umgebung bereitstellen
      - name: Set up Python
        run: uv python pin 3.12

      # 3. Abhängigkeiten installieren
      - name: Install dependencies
        run: |
          uv sync --group docs

      # 4. Dokumentation mit Sphinx bauen
      - name: Build documentation
        run: |
          uv run sphinx-build docs/source docs/build/html



      # 5. Die Website auf GitHub Pages veröffentlichen
      - name: Update the main gh-page website
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html  # Exakter Pfad zu deinen HTML-Dateien
          commit_message: "[ci skip] ${{ github.event.head_commit.message }}"