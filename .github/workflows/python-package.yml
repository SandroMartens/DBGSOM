name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Du kannst hier die Python-Versionen definieren, die deine SOM unterstützen soll
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    # 1. uv installieren und automatisch Caching für geladene Pakete aktivieren
    - name: Set up uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"
        version: "0.11.16"

    # 2. Die passende Python-Version über uv bereitstellen
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    # 3. Alle Abhängigkeiten (inkl. deiner dev-Gruppe mit pytest und ruff) installieren
    - name: Install dependencies
      run: uv sync --all-groups

    # 4. Linting und Code-Formatierung mit Ruff ausführen (ersetzt flake8)
    - name: Lint with ruff
      run: |
        # Prüft auf Syntaxfehler und logische Patzer
        uv run ruff check .
        # Prüft, ob der Code sauber formatiert ist
        uv run ruff format --check .

    # 5. Deine pytest-Tests ausführen (wieder einkommentiert!)
    - name: Test with pytest
      run: uv run pytest